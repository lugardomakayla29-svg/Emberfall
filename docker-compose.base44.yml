services:
  server:
    image: eclipse-temurin:25-jdk
    working_dir: /app
    volumes:
      - .:/app
      - gradle-cache:/home/gradle/.gradle
    environment:
      - GRADLE_USER_HOME=/home/gradle/.gradle
    command: ["sh", "/app/preview/start-server.sh"]
    restart: on-failure
    healthcheck:
      test: ["CMD", "sh", "-c", "grep -q 'Done (' /app/preview/server.log 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  web:
    image: nginx:alpine
    volumes:
      - ./preview:/usr/share/nginx/html:ro
    ports:
      - "3000:80"
    restart: on-failure
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  gradle-cache:
